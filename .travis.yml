language: python
python:
  - "2.7"
env:
  - ""
cache:
  directories:
    - .ci-replay-cache
before_install:
  - sudo apt-get update
  - sudo apt-get install csstidy libxml2-dev libxslt-dev
install:
  - pip install tox coveralls
script:
  - tox
stages:
  - name: replay-01
  - name: replay-02
  - name: replay-03
  - name: replay-04
  - name: replay-05
  - name: replay-06
  - name: replay-07
  - name: replay-08
  - name: replay-09
  - name: replay-10
jobs:
  exclude:
    - python: "2.7"
      env: ""
  include:
    - stage: replay-01
      python: "2.7"
      env: TOXENV=py33-1.6.X
    - stage: replay-02
      python: "2.7"
      env: TOXENV=py32-1.6.X
    - stage: replay-03
      python: "2.7"
      env: TOXENV=py27-1.6.X
    - stage: replay-04
      python: "2.7"
      env: TOXENV=py26-1.6.X
    - stage: replay-05
      python: "2.7"
      env: TOXENV=py33-1.5.X
    - stage: replay-06
      python: "2.7"
      env: TOXENV=py32-1.5.X
    - stage: replay-07
      python: "2.7"
      env: TOXENV=py27-1.5.X
    - stage: replay-08
      python: "2.7"
      env: TOXENV=py26-1.5.X
    - stage: replay-09
      python: "2.7"
      env: TOXENV=py27-1.4.X
    - stage: replay-10
      python: "2.7"
      env: TOXENV=py26-1.4.X

notifications:
  irc: "irc.freenode.org#django-compressor"
after_success: coveralls
